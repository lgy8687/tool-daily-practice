<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F2E9">
  <meta name="description" content="阅读和背诵《道德经》与《心经》。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>日课 · 读诵与日常</title>
  <link rel="stylesheet" href="styles.css?v=24">
</head>
<body>
  <div class="app-shell">

    <main>
      <section class="view active" id="view-today" aria-labelledby="today-title"></section>
      <section class="view" id="view-daily"></section>
      <section class="view" id="view-read" aria-labelledby="read-title"></section>
      <section class="view" id="view-recite" aria-labelledby="recite-title"></section>
      <section class="view" id="view-mine">
        <header class="page-head"><span class="eyebrow">PROFILE</span><h1>我的</h1><p class="page-head-date">记录只保存在这台设备</p></header>
        <div class="ds-card">
          <div class="card-head"><h2>数据备份</h2><span>本地存储</span></div>
          <p class="mine-note">记录只保存在这台设备的浏览器中。导出文件可用于备份或迁移，网页不会上传你的打卡数据。</p>
          <button class="button secondary" id="open-settings">导出 / 导入备份</button>
        </div>
      </section>
      <section class="view" id="view-stats" aria-labelledby="stats-title"></section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-route="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg><small>今日</small></button>
      <button class="nav-item" data-route="read"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 4.8 7.2 4.3 4 4.8v13c3.2-.5 6 0 8 1.7 2-1.7 4.8-2.2 8-1.7v-13c-3.2-.5-6 0-8 1.7z"/><path d="M12 6.5v13"/></svg><small>读经</small></button>
      <button class="nav-item" data-route="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5h18M6.5 20.5v-6M12 20.5v-13M17.5 20.5v-9"/></svg><small>统计</small></button>
      <button class="nav-item" data-route="mine"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg><small>我的</small></button>
    </nav>
  </div>

  <dialog id="settings-dialog" class="settings-dialog">
    <form method="dialog" class="dialog-top"><div><span class="eyebrow">PREFERENCES</span><h2>设置</h2></div><button class="icon-button" aria-label="关闭">×</button></form>
    <div class="setting-group">
      <h3>数据备份</h3><p class="muted">记录只保存在这台设备的浏览器中。导出文件可用于备份或迁移。</p>
      <div class="button-row"><button id="export-data" class="button secondary">导出记录</button><label class="button secondary file-button">导入备份<input id="import-data" type="file" accept="application/json"></label></div>
    </div>
    <p class="privacy-note">GitHub Pages 上的网页不接收你的打卡数据。</p>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="data/dao-de-jing.js?v=24"></script>
  <script src="data/dao-pinyin.js?v=24"></script>
  <script src="app.js?v=24"></script>
</body>
</html>
